<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מדריך מתקדם: 15 אפקטי כרטיסיות ב-CSS (Card Hover Effects)</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Raleway:400,600,700,900|Josefin+Sans:300,400,600|Source+Code+Pro">
  <style>
    /* ===================================================
       איפוס וסגנון עמוד
       =================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Raleway', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background-color: #121212;
      color: #ffffff;
      padding: 20px 10px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    h1 {
      font-size: clamp(22px, 5vw, 32px);
      margin-bottom: 8px;
      color: #f1f2f6;
      text-align: center;
    }

    .main-subtitle {
      color: #a4b0be;
      margin-bottom: 22px;
      font-size: clamp(13px, 3.5vw, 15px);
      text-align: center;
    }

    /* רשת כפתורי הניווט */
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 8px;
      width: 100%;
      max-width: 1100px;
      margin-bottom: 25px;
    }

    .menu-btn {
      background: #1f1f1f;
      border: 1px solid #3d3d3d;
      color: #dfe6e9;
      padding: 10px 6px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12.5px;
      font-weight: bold;
      transition: all 0.2s ease;
      text-align: center;
    }

    .menu-btn:hover {
      background: #0984e3;
      color: #ffffff;
      border-color: #74b9ff;
    }

    .menu-btn.active {
      background: #e84118;
      color: #ffffff;
      border-color: #c23616;
    }

    /* קונטיינר הצגה ראשי */
    .viewer {
      background: #1a1a1a;
      border-radius: 12px;
      padding: 25px 15px;
      max-width: 950px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .lesson-header {
      width: 100%;
      background: rgba(0, 0, 0, 0.45);
      border-right: 4px solid #e84118;
      padding: 14px 18px;
      margin-bottom: 25px;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }

    .lesson-title {
      font-size: clamp(16px, 4vw, 20px);
      color: #ff7675;
      font-weight: bold;
    }

    .css-badge {
      background: #000000;
      color: #00cec9;
      padding: 5px 12px;
      border-radius: 6px;
      font-family: Consolas, monospace;
      font-size: clamp(11px, 3vw, 13px);
      direction: ltr;
      border: 1px solid #00cec9;
      word-break: break-all;
    }

    .lesson-desc {
      font-size: clamp(12.5px, 3.5vw, 14px);
      color: #b2bec3;
      line-height: 1.5;
    }

    /* הבמה להצגת האפקט החי */
    .stage {
      min-height: 480px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle, #2a2a2a 0%, #151515 100%);
      border-radius: 8px;
      border: 1px dashed #3a3a3a;
      padding: 20px 10px;
      overflow: hidden;
      position: relative;
    }

    /* ===================================================
       סגנונות ל-15 האפקטים
       =================================================== */

    /* --- אפקט 1: שכבות טקסט תלת-ממדיות (3D Text Layers) --- */
    .card-text-3d {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .card-text-3d li a {
      position: relative;
      display: block;
      text-transform: uppercase;
      font-size: clamp(35px, 7vw, 60px);
      font-weight: 900;
      text-decoration: none;
      color: transparent;
      -webkit-text-stroke: 1px rgba(255, 255, 255, 0.4);
      letter-spacing: 2px;
      transition: 0.5s;
    }
    .card-text-3d li a::before,
    .card-text-3d li a::after {
      content: attr(data-text);
      position: absolute;
      top: 0;
      left: 0;
      transition: 0.5s;
    }
    .card-text-3d li a::before {
      color: #e84118;
      z-index: 1;
      -webkit-text-stroke: 1px #000;
      transform: translate(0, 0);
    }
    .card-text-3d li a::after {
      color: #00cec9;
      z-index: 2;
      -webkit-text-stroke: 1px #000;
      transform: translate(0, 0);
    }
    .card-text-3d li a:hover::before {
      transform: translate(12px, -12px);
    }
    .card-text-3d li a:hover::after {
      transform: translate(24px, -24px);
    }
    .card-text-3d li a:hover {
      color: #ffffff;
      -webkit-text-stroke: 1px #ffffff;
    }

    /* --- אפקט 2: כרטיסיית שכבות גולשת וחשופה (Glass Stacked Card) --- */
    .card-stacked {
      position: relative;
      width: 280px;
      height: 380px;
      background: #232323;
      border-radius: 15px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      transition: 0.5s;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      text-align: center;
    }
    .card-stacked::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #ff7675, #d63031);
      clip-path: circle(120px at 80% 20%);
      transition: 0.5s ease-in-out;
    }
    .card-stacked:hover::before {
      clip-path: circle(300px at 80% -20%);
    }
    .card-stacked h3 {
      font-size: 24px;
      color: #fff;
      z-index: 2;
      margin-bottom: 10px;
    }
    .card-stacked p {
      font-size: 14px;
      color: #dfe6e9;
      z-index: 2;
      line-height: 1.5;
    }

    /* --- אפקט 3: דמות פורצת מהכרטיס (Character Pop-out) --- */
    .card-popout {
      position: relative;
      width: 300px;
      height: 380px;
      background: linear-gradient(45deg, #0984e3, #6c5ce7);
      border-radius: 20px;
      display: flex;
      align-items: flex-end;
      padding: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      cursor: pointer;
    }
    .card-popout img {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      height: 320px;
      transition: 0.5s;
      z-index: 2;
      pointer-events: none;
    }
    .card-popout:hover img {
      height: 420px;
      bottom: 20px;
    }
    .card-popout .popout-content {
      position: relative;
      z-index: 3;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(5px);
      padding: 15px;
      border-radius: 12px;
      color: #fff;
      width: 100%;
      transition: 0.5s;
    }

    /* --- אפקט 4: כרטיסיית שני חצאים Split Card (Face 1 & Face 2) --- */
    .split-card {
      position: relative;
      width: 300px;
      height: 380px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      overflow: hidden;
      color: #333;
    }
    .split-card .face {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: 0.5s;
      padding: 20px;
      text-align: center;
      box-sizing: border-box;
    }
    .split-card .face.face1 {
      background: #011627;
      color: #fff;
      z-index: 2;
    }
    .split-card .face.face1 h2 {
      font-size: 60px;
      color: #41ead4;
      transition: 0.5s;
    }
    .split-card:hover .face.face1 {
      height: 90px;
      width: 90px;
      border-radius: 50%;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: transparent;
      border: 2px solid #011627;
    }
    .split-card:hover .face.face1 h2 {
      font-size: 24px;
      color: #011627;
    }
    .split-card .face.face2 {
      background: #fff;
      padding-top: 100px;
    }

    /* --- אפקט 5: שתי תיבות מתמזגות במרכז (Face Slide Convergence) --- */
    .box-merge-card {
      position: relative;
      width: 300px;
      height: 380px;
      cursor: pointer;
    }
    .box-merge-card .face {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 190px;
      transition: 0.5s;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }
    .box-merge-card .face.face1 {
      background: #2c3e50;
      color: #fff;
      transform: translateY(100px);
      z-index: 1;
      border-radius: 10px 10px 0 0;
    }
    .box-merge-card .face.face2 {
      top: 190px;
      background: #fff;
      color: #333;
      transform: translateY(-100px);
      box-shadow: 0 15px 30px rgba(0,0,0,0.3);
      border-radius: 0 0 10px 10px;
    }
    .box-merge-card:hover .face.face1 {
      transform: translateY(0);
      background: #e74c3c;
    }
    .box-merge-card:hover .face.face2 {
      transform: translateY(0);
    }

    /* --- אפקט 6: כרטיס פרופיל עם צל כפול ומסגרת נופלת --- */
    .profile-hover-card {
      position: relative;
      width: 300px;
      height: 400px;
      background: #222;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .profile-hover-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      clip-path: polygon(0 0, 100% 0, 100% 40%, 0 60%);
      transition: 0.5s;
    }
    .profile-hover-card:hover::before {
      clip-path: polygon(0 0, 100% 0, 100% 20%, 0 30%);
    }
    .profile-hover-card .img-container {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      width: 140px;
      height: 140px;
      border-radius: 50%;
      overflow: hidden;
      border: 4px solid #fff;
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
      transition: 0.5s;
    }
    .profile-hover-card:hover .img-container {
      top: 20px;
      width: 100px;
      height: 100px;
    }
    .profile-hover-card .img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .profile-hover-card .details {
      position: absolute;
      bottom: 25px;
      width: 100%;
      text-align: center;
      padding: 0 20px;
    }
    .profile-hover-card .details h2 {
      font-size: 20px;
      color: #fff;
      margin-bottom: 8px;
    }

    /* --- אפקט 7: כרטיסיית כותרת נפתחת (Post Title Overlay) --- */
    .post-card {
      position: relative;
      width: 320px;
      height: 400px;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 15px 30px rgba(0,0,0,0.5);
    }
    .post-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: 0.5s;
    }
    .post-card:hover img {
      opacity: 0.3;
      transform: scale(1.1);
    }
    .post-card .post-content {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      padding: 25px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      box-sizing: border-box;
      z-index: 2;
    }
    .post-card .post-content h2 {
      color: #fff;
      font-size: 24px;
      transform: translateY(120px);
      transition: 0.5s;
    }
    .post-card .post-content p {
      color: #dfe6e9;
      font-size: 14px;
      transform: translateY(150px);
      opacity: 0;
      transition: 0.5s;
      margin: 10px 0 15px 0;
    }
    .post-card:hover .post-content h2,
    .post-card:hover .post-content p {
      transform: translateY(0);
      opacity: 1;
    }

    /* --- אפקט 8: כרטיסיית Glass Profile עם הטיה ורשתות חברתיות --- */
    .glass-profile-card {
      position: relative;
      width: 320px;
      padding: 30px 20px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      box-shadow: 0 15px 35px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transform: perspective(1000px) rotateX(10deg);
      transition: 0.6s ease;
    }
    .glass-profile-card:hover {
      transform: perspective(1000px) rotateX(0deg) translateY(-10px);
      border-color: rgba(255, 255, 255, 0.4);
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    .glass-profile-card .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 4px solid #ff7675;
      overflow: hidden;
      margin-bottom: 15px;
    }
    .glass-profile-card .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .glass-profile-card h3 {
      font-size: 20px;
      color: #fff;
      margin-bottom: 6px;
    }
    .glass-profile-card p {
      font-size: 13.5px;
      color: #b2bec3;
      margin-bottom: 15px;
    }
    .glass-profile-card .social-links {
      display: flex;
      gap: 12px;
      list-style: none;
    }
    .glass-profile-card .social-links a {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      text-decoration: none;
      transition: 0.3s;
    }
    .glass-profile-card .social-links a:hover {
      background: #ff7675;
      transform: translateY(-4px);
    }

    /* --- אפקט 9: היפוך תלת-ממדי מלא (3D Flip Card) --- */
    .flip-card {
      width: 300px;
      height: 380px;
      perspective: 1000px;
    }
    .flip-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.8s;
      transform-style: preserve-3d;
    }
    .flip-card:hover .flip-inner {
      transform: rotateY(180deg);
    }
    .flip-front, .flip-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 25px;
      box-sizing: border-box;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
    .flip-front {
      background: linear-gradient(135deg, #1e3799, #0c2461);
      color: #fff;
    }
    .flip-back {
      background: linear-gradient(135deg, #eb2f06, #b71540);
      color: #fff;
      transform: rotateY(180deg);
    }

    /* --- אפקט 10: זרקור מעקב זוהר (Border Beam / Glow Trace) --- */
    .glow-border-card {
      position: relative;
      width: 300px;
      height: 380px;
      background: #1e1e1e;
      border-radius: 12px;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      overflow: hidden;
    }
    .glow-border-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: conic-gradient(transparent, transparent, transparent, #00d2d3);
      animation: rotate-beam 4s linear infinite;
    }
    .glow-border-card::after {
      content: '';
      position: absolute;
      inset: 3px;
      background: #181818;
      border-radius: 10px;
    }
    .glow-border-card .glow-inner {
      position: relative;
      z-index: 2;
    }
    @keyframes rotate-beam {
      100% { transform: rotate(360deg); }
    }

    /* --- אפקט 11: כרטיסיית פתיחה אלסטית (Sliding Drawer Card) --- */
    .drawer-card {
      position: relative;
      width: 300px;
      height: 380px;
      background: #2c3e50;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .drawer-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .drawer-card .drawer {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background: #ffffff;
      color: #333;
      padding: 20px;
      box-sizing: border-box;
      transform: translateY(65%);
      transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      border-radius: 16px 16px 0 0;
    }
    .drawer-card:hover .drawer {
      transform: translateY(0);
    }

    /* --- אפקט 12: כרטיסייה נוזלית בגזירה (Liquid Wave Blob) --- */
    .blob-card {
      position: relative;
      width: 300px;
      height: 380px;
      background: #1e272e;
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
    .blob-card::before {
      content: '';
      position: absolute;
      width: 250px;
      height: 250px;
      background: #ff5252;
      border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
      animation: morph-blob 6s linear infinite;
      opacity: 0.2;
      transition: 0.5s;
    }
    .blob-card:hover::before {
      opacity: 0.8;
      transform: scale(1.4);
    }
    @keyframes morph-blob {
      0%, 100% { border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; }
      50% { border-radius: 60% 40% 30% 70% / 50% 60% 40% 60%; }
    }
    .blob-card .blob-content {
      position: relative;
      z-index: 2;
    }

    /* --- אפקט 13: מסגרת קו מודרנית במעבר עכבר (Outlined Border Trace) --- */
    .trace-card {
      position: relative;
      width: 300px;
      height: 380px;
      background: #2f3542;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 25px;
      color: #fff;
    }
    .trace-card span.line {
      position: absolute;
      background: #2ed573;
      transition: 0.5s;
    }
    .trace-card span.line-top { top: 0; left: 0; width: 0%; height: 3px; }
    .trace-card span.line-right { top: 0; right: 0; width: 3px; height: 0%; }
    .trace-card span.line-bottom { bottom: 0; right: 0; width: 0%; height: 3px; }
    .trace-card span.line-left { bottom: 0; left: 0; width: 3px; height: 0%; }
    .trace-card:hover span.line-top,
    .trace-card:hover span.line-bottom { width: 100%; }
    .trace-card:hover span.line-right,
    .trace-card:hover span.line-left { height: 100%; }

    /* --- אפקט 14: מראה חלבי רדיאלי (Radial Frosted Card) --- */
    .radial-glass-card {
      position: relative;
      width: 300px;
      height: 380px;
      background: #182C61;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }
    .radial-glass-card::before {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #6D214F, transparent);
      opacity: 0;
      transition: 0.5s;
    }
    .radial-glass-card:hover::before {
      opacity: 1;
      transform: scale(1.3);
    }
    .radial-glass-card .content {
      position: relative;
      z-index: 2;
    }

    /* --- אפקט 15: כרטיסיית פירוק שכבות (Layer Separation) --- */
    .layer-card {
      position: relative;
      width: 280px;
      height: 360px;
      perspective: 800px;
    }
    .layer-card .layer-box {
      width: 100%;
      height: 100%;
      background: #33d9b2;
      border-radius: 12px;
      position: absolute;
      transition: 0.5s;
    }
    .layer-card .layer-1 { background: #218c74; transform: translateZ(0); }
    .layer-card .layer-2 { background: #33d9b2; transform: translateZ(0); }
    .layer-card .layer-3 {
      background: #ffffff;
      color: #2c3e50;
      transform: translateZ(0);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      text-align: center;
    }
    .layer-card:hover .layer-1 { transform: rotate(-10deg) translate(-15px, 10px); }
    .layer-card:hover .layer-2 { transform: rotate(10deg) translate(15px, -10px); }
    .layer-card:hover .layer-3 { transform: translateZ(30px); }
  </style>
</head>
<body>

  <h1>מדריך מתקדם: 15 אפקטי כרטיסיות ב-CSS</h1>
  <p class="main-subtitle">בחר אפקט לצפייה בכרטיסייה החיה, קריאת ההסבר בעברית וצפייה בפקודת ה-CSS המרכזית:</p>

  <!-- תפריט כפתורים מותאם למובייל -->
  <div class="menu-grid" id="menuGrid"></div>

  <!-- תיבת תצוגה ראשית -->
  <div class="viewer">
    <div class="lesson-header">
      <div class="title-row">
        <span class="lesson-title" id="effectTitle"></span>
        <span class="css-badge" id="cssBadge"></span>
      </div>
      <p class="lesson-desc" id="effectDesc"></p>
    </div>

    <div class="stage" id="stageArea"></div>
  </div>

  <script>
    // מאגר 15 האפקטים
    const cardsData = [
      {
        title: "אפקט 1: שכבות טקסט תלת-ממדיות (3D Text Layers)",
        cmd: "attr(data-text) + translate(12px, -12px);",
        desc: "שימוש באלמנטים מדומים עם attr(data-text) ו-webkit-text-stroke ליצירת שכבות טקסט תלת-ממדיות שנפרדות במעבר עכבר.",
        html: `
          <ul class="card-text-3d">
            <li><a href="#" data-text="Design">Design</a></li>
            <li><a href="#" data-text="Code">Code</a></li>
          </ul>
        `
      },
      {
        title: "אפקט 2: כרטיסיית שכבות גולשת וחשופה (Glass Stacked Card)",
        cmd: "clip-path: circle(...) at 80% 20%;",
        desc: "עיגול חיתוך צבעוני שמתרחב ומכסה את הרקע בעוד התוכן והטקסט נחשפים בצורה חלקה.",
        html: `
          <div class="card-stacked">
            <h3>כרטיס מידע</h3>
            <p>חיתוך מעגלי ב-clip-path שמתרחב ומציף את הכרטיס ברקע גרדיאנט עשיר.</p>
          </div>
        `
      },
      {
        title: "אפקט 3: דמות פורצת מהכרטיס (Character Pop-out)",
        cmd: "img: height 320px -> 420px; bottom: 20px;",
        desc: "דמות או פריט שפורצים את גבולות הכרטיס כלפי מעלה ויוצרים תחושת עומק וגובה.",
        html: `
          <div class="card-popout">
            <img src="https://assets.codepen.io/13471/sparkler.png" alt="Hero">
            <div class="popout-content">
              <h3>Super Hero</h3>
              <p>הדמות מגדילה את הגובה ופורצת מחוץ לגבולות הכרטיס במעבר עכבר.</p>
            </div>
          </div>
        `
      },
 {
  title: "אפקט 3: דמות פורצת מהכרטיס (Character Pop-out)",
  cmd: "img: height 340px -> 430px; bottom: 20px;",
  desc: "דמות או גיבור עם רקע שקוף (PNG) שעומד בתוך הכרטיס, ובעת מעבר עכבר מגדיל את גובהו ופורץ מחוץ לגבולות הכרטיסייה.",
  html: `
    <div class="card-popout">
      <img src="https://pngimg.com/d/captain_marvel_PNG14.png" alt="Captain Marvel" onerror="this.src='https://assets.codepen.io/13471/sparkler.png'">
      <div class="popout-content">
        <h3>Captain Marvel</h3>

        <a href="#" class="popout-btn">קרא עוד</a>

    </div>
  `
},
      {
        title: "אפקט 5: שתי תיבות מתמזגות (Box Merge Convergence)",
        cmd: "face1: translateY(100px -> 0); face2: translateY(-100px -> 0);",
        desc: "חצי עליון וחצי תחתון נעים מכיוונים נגדיים ומתמזגים לכרטיסייה אחת שלמה במרכז.",
        html: `
          <div class="box-merge-card">
            <div class="face face1">
              <h3>Design UI</h3>
            </div>
            <div class="face face2">
              <p>תוכן השכבה התחתונה שמחליק למעלה ומתאחד עם הכותרת.</p>
            </div>
          </div>
        `
      },
      {
        title: "אפקט 6: כרטיס פרופיל עם צל כפול ומסגרת נופלת",
        cmd: "clip-path: polygon(...); img: top 60px -> 20px;",
        desc: "מסגרת פוליגון עליונה שמשתנה, תמונת הפרופיל מתכווצת ומפנה מקום לפרטי המשתמש.",
        html: `
          <div class="profile-hover-card">

        `
      },
      {
        title: "אפקט 7: כרטיסיית כותרת נפתחת (Post Title Overlay)",
        cmd: "img: opacity 0.3; content: translateY(0);",
        desc: "התמונה מחשיכה ומבצעת זום קל, בעוד הכותרת והפסקה עולות מתחתית הכרטיסיה.",
        html: `
          <div class="post-card">
            <img src="https://picsum.photos/id/1015/600/600" alt="Post">
            <div class="post-content">
              <h2>כותרת המאמר</h2>
              <p>תקציר הפוסט שמופיע בהדרגה עם אנימציית מעבר עכבר חלקה.</p>
            </div>
          </div>
        `
      },
      {
        title: "אפקט 8: כרטיסיית Glass Profile עם הטיה ורשתות חברתיות",
        cmd: "rotateX(10deg -> 0deg); backdrop-filter: blur(10px);",
        desc: "עיצוב זכוכית עם הטיית תלת-ממד בפרספקטיבה, אייקונים חברתיים שמתרוממים במעבר עכבר.",
        html: `
          <div class="glass-profile-card">
            <div class="avatar">
              <img src="https://picsum.photos/id/1025/300/300" alt="Profile">
            </div>
            <h3>יונתן דוד</h3>
            <p>מומחה UI/UX ו-CSS מתקדם</p>
            <ul class="social-links">
              <li><a href="#"><i class="fab fa-github"></i></a></li>
              <li><a href="#"><i class="fab fa-linkedin-in"></i></a></li>
              <li><a href="#"><i class="fab fa-twitter"></i></a></li>
            </ul>
          </div>
        `
      },
      {
        title: "אפקט 9: היפוך תלת-ממדי מלא (3D Flip Card)",
        cmd: "transform-style: preserve-3d; rotateY(180deg);",
        desc: "סיבוב של 180 מעלות בציר ה-Y בעזרת backface-visibility שחושף את גב הכרטיסייה.",
        html: `
          <div class="flip-card">
            <div class="flip-inner">
              <div class="flip-front">
                <h2>צד קדמי</h2>
                <p>העבר עכבר כדי להפוך ב-180 מעלות בתלת-ממד</p>
              </div>
              <div class="flip-back">
                <h2>צד אחורי</h2>
                <p>המידע המלא נחשף בגב הכרטיסייה</p>
              </div>
            </div>
          </div>
        `
      },
      {
        title: "אפקט 10: זרקור מעקב זוהר (Border Beam / Glow Trace)",
        cmd: "conic-gradient(...) + rotate(360deg);",
        desc: "קרן גרדיאנט מעגלית שמסתובבת ברקע ומאירה מסגרת זוהרת ודקה סביב הכרטיסייה.",
        html: `
          <div class="glow-border-card">
            <div class="glow-inner">
              <h2>Border Beam</h2>
              <p>מסגרת זוהרת בתנועה מעגלית רציפה</p>
            </div>
          </div>
        `
      },
      {
        title: "אפקט 11: כרטיסיית מגירה נשלפת (Sliding Drawer)",
        cmd: "transform: translateY(65% -> 0); cubic-bezier(...);",
        desc: "חלונית מידע תחתונה שנשלפת כמו מגירה עם סיומת קפיצית חלקה.",
        html: `
          <div class="drawer-card">
            <img src="https://picsum.photos/id/1040/600/600" alt="Drawer Image">
            <div class="drawer">
              <h3>מגירת פרטים</h3>
              <p>חלונית תוכן שנשלפת מתחתית הכרטיסיה בעת מעבר עכבר.</p>
            </div>
          </div>
        `
      },
      {
        title: "אפקט 12: כרטיסיית גל נוזלי (Liquid Morphing Blob)",
        cmd: "border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;",
        desc: "שכבת רקע שמשנה את צורתה בצורה אמורפית וחלקה ומעניקה תחושה אורגנית.",
        html: `
          <div class="blob-card">
            <div class="blob-content">
              <h2>Fluid Morph</h2>
              <p>צורה אמורפית המשתנה במחזוריות ומודגשת בהובר</p>
            </div>
          </div>
        `
      },
      {
        title: "אפקט 13: מסגרת קו מודרנית במעבר עכבר (Border Trace)",
        cmd: "span.line: width / height -> 100%;",
        desc: "ארבעה קווים נפרדים הנמתחים במקביל לאורך הפאות ויוצרים מסגרת מושלמת.",
        html: `
          <div class="trace-card">
            <span class="line line-top"></span>
            <span class="line line-right"></span>
            <span class="line line-bottom"></span>
            <span class="line line-left"></span>
            <h2>Border Trace</h2>
            <p>קווים שנמתחים מהקצוות וסוגרים מסגרת שלמה</p>
          </div>
        `
      },
      {
        title: "אפקט 14: מראה חלבי רדיאלי (Radial Frosted Card)",
        cmd: "radial-gradient(circle at center, ...); scale(1.3);",
        desc: "הילת גרדיאנט מעגלית שמתפשטת ממרכז הכרטיסיה ויוצרת אפקט זוהר עמוק.",
        html: `
          <div class="radial-glass-card">
            <div class="content">
              <h2>Radial Glow</h2>
              <p>הילת אור מתרחבת שמבליטה את התוכן הפנימי</p>
            </div>
          </div>
        `
      },
      {
        title: "אפקט 15: כרטיסיית פירוק שכבות (Layer Separation)",
        cmd: "rotate(±10deg) + translateZ(30px);",
        desc: "פירוק הכרטיסיה לשלוש שכבות נפרדות שנפרסות במרחב התלת-ממדי.",
        html: `
          <div class="layer-card">
            <div class="layer-box layer-1"></div>
            <div class="layer-box layer-2"></div>
            <div class="layer-box layer-3">
              <h3>שכבות תלת-ממד</h3>
              <p>שלוש שכבות שנפרדות ויוצרות עומק ויזואלי</p>
            </div>
          </div>
        `
      }
    ];

    const menuEl = document.getElementById('menuGrid');
    const stageEl = document.getElementById('stageArea');
    const titleEl = document.getElementById('effectTitle');
    const badgeEl = document.getElementById('cssBadge');
    const descEl = document.getElementById('effectDesc');

    function renderCard(card, btn) {
      document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');

      titleEl.innerText = card.title;
      badgeEl.innerText = card.cmd;
      descEl.innerText = card.desc;
      stageEl.innerHTML = card.html;

      // מניעת קפיצת דף בלחיצה על קישורים
      stageEl.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', (e) => e.preventDefault());
      });
    }

    // יצירת 15 כפתורי הניווט
    cardsData.forEach((card, index) => {
      const b = document.createElement('button');
      b.className = 'menu-btn';
      b.innerText = `כרטיס ${index + 1}`;
      b.onclick = () => renderCard(card, b);
      menuEl.appendChild(b);
    });

    // טעינה ראשונית של אפקט 1
    renderCard(cardsData[0], menuEl.firstChild);
  </script>

</body>
</html>
